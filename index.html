<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カクオリパ</title>
  <style>
    :root {
      --kaku-red: #ff0055;
      --kaku-bg: #0d0d12;
      --card-bg: #1a1a24;
      --coin-gold: #ffd700;
      --text-gray: #a0a0b0;
      --paypal-blue: #003087;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background-color: var(--kaku-bg);
      color: #fff;
      padding-top: 60px;
      padding-bottom: 70px;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background: var(--kaku-bg);
      position: relative;
    }

    /* ヘッダー */
    .header {
      position: fixed;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 100%; max-width: 480px;
      height: 60px;
      background: #12121c;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      z-index: 10;
      border-bottom: 1px solid #252535;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 900;
      color: var(--kaku-red);
      letter-spacing: -0.5px;
      text-shadow: 0 0 10px rgba(255, 0, 85, 0.5);
    }

    .coin-status {
      display: flex;
      align-items: center;
      background: #222230;
      padding: 4px 12px;
      border-radius: 20px;
      gap: 8px;
      font-weight: bold;
      border: 1px solid rgba(255, 215, 0, 0.3);
    }

    .coin-icon {
      width: 20px; height: 20px;
      background: var(--coin-gold);
      border-radius: 50%;
      color: #000;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem; font-weight: 900;
    }

    .add-coin-btn {
      background: var(--kaku-red);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 22px; height: 22px;
      font-weight: bold;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }

    /* カテゴリタブ */
    .category-bar {
      display: flex;
      background: #12121c;
      border-bottom: 1px solid #252535;
    }

    .tab {
      flex: 1;
      text-align: center;
      padding: 12px 0;
      font-size: 0.95rem;
      font-weight: bold;
      color: #fff;
      border-bottom: 3px solid var(--kaku-red);
      background: rgba(255, 0, 85, 0.05);
    }

    /* パック一覧 */
    .pack-list {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .pack-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #2a2a3a;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      position: relative;
    }

    .pack-banner {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
    }

    .pack-info { padding: 12px; }
    .pack-title { font-size: 1rem; font-weight: bold; margin-bottom: 8px; }

    .price-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .price {
      font-size: 1.1rem;
      font-weight: 900;
      color: var(--coin-gold);
      display: flex; align-items: center; gap: 6px;
    }

    .original-price {
      font-size: 0.85rem;
      color: var(--text-gray);
      text-decoration: line-through;
    }

    .discount-badge {
      position: absolute;
      top: 10px; left: 10px;
      background: var(--kaku-red);
      color: #fff;
      font-weight: 900;
      font-size: 0.8rem;
      padding: 4px 8px;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
      z-index: 2;
    }

    .stock-text { font-size: 0.8rem; color: var(--text-gray); }

    .progress-bar {
      width: 100%; height: 8px;
      background: #2a2a38;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #00ff88, #00f3ff);
    }

    /* ガチャボタンエリア */
    .gacha-btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .gacha-btn {
      background: linear-gradient(135deg, #ff0055, #ff5500);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 4px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(255, 0, 85, 0.3);
      transition: transform 0.1s;
    }

    .gacha-btn:active { transform: scale(0.96); }

    /* 下部ナビゲーション */
    .footer-nav {
      position: fixed;
      bottom: 0; left: 50%;
      transform: translateX(-50%);
      width: 100%; max-width: 480px;
      height: 60px;
      background: #12121c;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid #252535;
      z-index: 10;
    }

    .nav-item {
      display: flex; flex-direction: column; align-items: center;
      font-size: 0.75rem; color: var(--text-gray);
      background: none; border: none; cursor: pointer;
      gap: 3px;
    }

    .nav-item.active { color: var(--kaku-red); font-weight: bold; }

    /* モーダル */
    .modal {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(5px);
      z-index: 100;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-box {
      width: 100%; max-width: 360px;
      background: #1a1a24;
      border: 2px solid var(--kaku-red);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      position: relative;
    }

    .modal-title { font-size: 1.3rem; font-weight: bold; margin-bottom: 15px; color: #fff; }

    .close-icon {
      position: absolute; top: 10px; right: 15px;
      font-size: 1.5rem; color: var(--text-gray); cursor: pointer;
    }

    /* 演出モーダル */
    .video-modal {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #000;
      z-index: 101;
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    .video-modal video { width: 100%; height: 100%; object-fit: contain; }

    /* 星演出 */
    .star-stage {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px;
    }
    .star-icon { font-size: 4rem; transition: transform 1.5s ease-out, opacity 0.5s; }
    .star-text { font-size: 1.5rem; font-weight: 900; color: var(--coin-gold); text-shadow: 0 0 10px rgba(255, 215, 0, 0.8); }

    /* 結果モーダル */
    .result-rank { font-size: 1.5rem; font-weight: 900; color: var(--coin-gold); margin-bottom: 10px; }
    .result-item-name { font-size: 1.05rem; font-weight: bold; margin-bottom: 15px; max-height: 180px; overflow-y: auto; text-align: left; background: #0f0f15; padding: 10px; border-radius: 8px; }

    .action-btns { display: flex; flex-direction: column; gap: 10px; }
    .act-btn {
      padding: 12px; border: none; border-radius: 25px; font-weight: bold; font-size: 0.95rem; cursor: pointer;
    }
    .btn-coin { background: var(--coin-gold); color: #000; }
    .btn-ship { background: var(--kaku-red); color: #fff; }
    .btn-paypal { background: var(--paypal-blue); color: #fff; font-size: 1rem; }

    .form-input {
      width: 100%; padding: 10px; margin: 8px 0 15px;
      border-radius: 8px; border: 1px solid #3a3a4c; background: #0f0f15; color: #fff;
    }

    .coin-plan {
      display: flex; justify-content: space-between; align-items: center;
      background: #252535; padding: 12px; border-radius: 8px; margin-bottom: 10px;
    }

    .code-section {
      border-top: 1px solid #3a3a4c; margin-top: 15px; padding-top: 15px; text-align: left;
    }
    .code-title { font-size: 0.85rem; color: var(--text-gray); margin-bottom: 5px; }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- ヘッダー -->
    <header class="header">
      <div class="logo">カクオリパ</div>
      <div class="coin-status">
        <div class="coin-icon">⚡</div>
        <span id="userCoins">150</span>
        <button class="add-coin-btn" onclick="openModal('paypalModal')">＋</button>
      </div>
    </header>

    <!-- カテゴリタブ -->
    <div class="category-bar">
      <div class="tab">通常オリパ類</div>
    </div>

    <!-- パック一覧 -->
    <div class="pack-list" id="packList"></div>

    <!-- 下部ナビ -->
    <nav class="footer-nav">
      <button class="nav-item active" onclick="scrollToTop()">
        <span>🏠</span>
        <span>オリパ一覧</span>
      </button>
      <button class="nav-item" onclick="openHistory()">
        <span>📜</span>
        <span>獲得履歴</span>
      </button>
      <button class="nav-item" onclick="openModal('addressModal')">
        <span>📍</span>
        <span>住所設定</span>
      </button>
      <button class="nav-item" onclick="openModal('paypalModal')">
        <span>💳</span>
        <span>COIN購入</span>
      </button>
    </nav>
  </div>

  <!-- 動画/星演出モーダル -->
  <div class="video-modal" id="videoModal">
    <video id="gachaVideo" playsinline style="display:none;"></video>
    <div class="star-stage" id="starStage" style="display:none;">
      <div class="star-icon" id="starAnim">⭐</div>
      <div class="star-text" id="starMsg">止まれ...！</div>
    </div>
  </div>

  <!-- ガチャ結果モーダル -->
  <div class="modal" id="resultModal">
    <div class="modal-box">
      <div class="result-rank" id="resRank">結果発表</div>
      <div class="result-item-name" id="resName"></div>

      <div class="action-btns" id="actionBtns">
        <button class="act-btn btn-coin" onclick="convertCoin()">すべてコインに変換 (<span id="coinVal">0</span> COIN)</button>
        <button class="act-btn btn-ship" onclick="showShipForm()">自宅に発送する</button>
      </div>

      <div id="shipForm" style="display:none; text-align:left; margin-top:15px;">
        <label style="font-size:0.8rem">お届け先住所:</label>
        <input type="text" class="form-input" id="addressInput" placeholder="住所を入力してください">
        <button class="act-btn btn-ship" style="width:100%" onclick="submitShip()">発送確定</button>
      </div>
    </div>
  </div>

  <!-- COINチャージ Modal -->
  <div class="modal" id="paypalModal">
    <div class="modal-box">
      <span class="close-icon" onclick="closeModal('paypalModal')">×</span>
      <div class="modal-title">COINチャージ</div>
      
      <div class="coin-plan">
        <span>⚡ 100 COIN</span>
        <button class="act-btn btn-paypal" onclick="redirectToPaypal('100', '60')">¥60 で購入</button>
      </div>
      <div class="coin-plan">
        <span>⚡ 500 COIN</span>
        <button class="act-btn btn-paypal" onclick="redirectToPaypal('500', '130')">¥130 で購入</button>
      </div>
      <div class="coin-plan">
        <span>⚡ 1000 COIN</span>
        <button class="act-btn btn-paypal" onclick="redirectToPaypal('1000', '260')">¥260 で購入</button>
      </div>

      <!-- チャージコード入力 (伏字化) -->
      <div class="code-section">
        <div class="code-title">チャージコードをお持ちの方:</div>
        <input type="password" class="form-input" id="chargeCodeInput" placeholder="••••••••••••" style="margin-bottom:8px;">
        <button class="act-btn btn-ship" style="width:100%; border-radius:8px; padding:10px;" onclick="redeemCode()">コードを適用する</button>
      </div>
    </div>
  </div>

  <!-- 住所設定モーダル -->
  <div class="modal" id="addressModal">
    <div class="modal-box">
      <span class="close-icon" onclick="closeModal('addressModal')">×</span>
      <div class="modal-title">配送先住所の設定</div>
      <input type="text" class="form-input" id="defaultAddress" placeholder="例: 東京都渋谷区宇田川町1-1">
      <button class="act-btn btn-ship" style="width:100%" onclick="saveAddress()">保存する</button>
    </div>
  </div>

  <!-- 獲得履歴モーダル -->
  <div class="modal" id="historyModal">
    <div class="modal-box">
      <span class="close-icon" onclick="closeModal('historyModal')">×</span>
      <div class="modal-title">獲得履歴</div>
      <div id="historyList" style="max-height: 250px; overflow-y: auto; text-align: left; font-size:0.85rem;"></div>
    </div>
  </div>

  <script>
    const SPREADSHEET_ID = '1CaHgKm-ti-JVyW79mK8wXT21TqjTrIEz6_YYbtrn-5U';
    const GVIZ_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=Sheet1`;
    const PAYPAL_RECEIVER = 'sixyami1206@gmail.com';
    const SECRET_KEY = '12065533';

    let isNewUser = localStorage.getItem('kaku_is_new') === null;

    let userCoins = parseInt(localStorage.getItem('kaku_coins')) || 150;
    let savedAddress = localStorage.getItem('kaku_address') || '';
    let history = JSON.parse(localStorage.getItem('kaku_history')) || [];
    
    let packs = [];
    let currentResults = []; // ガチャ結果一時保存用
    let totalReturnCoin = 0;

    const COIN_RETURNS = { '1等': 1600, '2等': 600, '3等': 10, '4等': 1 };

    function updateStorage() {
      localStorage.setItem('kaku_coins', userCoins);
      localStorage.setItem('kaku_address', savedAddress);
      localStorage.setItem('kaku_history', JSON.stringify(history));
      localStorage.setItem('kaku_is_new', 'false');
      document.getElementById('userCoins').innerText = userCoins.toLocaleString();
    }

    // スプレッドシートデータ取得（5秒ごとに更新）
    async function loadData() {
      document.getElementById('userCoins').innerText = userCoins.toLocaleString();
      if (savedAddress) {
        document.getElementById('defaultAddress').value = savedAddress;
      }

      try {
        const res = await fetch(GVIZ_URL);
        const txt = await res.text();
        const json = JSON.parse(txt.substring(txt.indexOf('{'), txt.lastIndexOf('}') + 1));
        const cols = json.table.cols.map(c => c ? c.label : '');
        
        packs = json.table.rows.map(r => {
          let item = {};
          r.c.forEach((cell, i) => { 
            const colName = cols[i] || '';
            item[colName] = cell ? cell.v : ''; 
            item[`_col_${i}`] = cell ? cell.v : '';
          });

          item['_rate1'] = item['1等確率'] || item['_col_9'] || 0;
          item['_rate2'] = item['2等確率'] || item['_col_10'] || 0;
          item['_rate3'] = item['3等確率'] || item['_col_11'] || 0;
          item['_rate4'] = item['4等確率'] || item['_col_12'] || 0;
          item['_effectVideo'] = item['演出動画'] || item['動画URL'] || item['_col_13'] || '';

          return item;
        }).filter(item => item['名前'] || item['_col_0']);

        renderPackList();
      } catch (e) {
        console.error("データ同期エラー:", e);
      }
    }

    // 5秒周期で自動データチェック
    setInterval(loadData, 5000);

    function renderPackList() {
      const container = document.getElementById('packList');
      container.innerHTML = '';

      packs.forEach((p, idx) => {
        const originalCost = parseInt(p['必要COIN'] || p['_col_1'] || 0);
        const finalCost = isNewUser ? Math.floor(originalCost * 0.2) : originalCost;

        const stock = p['在庫数'] || p['_col_2'] || 100;
        const percent = Math.min(100, (stock / 50000) * 100);

        const card = document.createElement('div');
        card.className = 'pack-card';
        card.innerHTML = `
          ${isNewUser ? '<div class="discount-badge">新規限定 80% OFF</div>' : ''}
          <img class="pack-banner" src="${p['サムネURL'] || p['_col_3'] || ''}" alt="パック">
          <div class="pack-info">
            <div class="pack-title">${p['名前'] || p['_col_0']}</div>
            <div class="price-row">
              <div class="price">
                ⚡ ${Number(finalCost).toLocaleString()} /1回
                ${isNewUser ? `<span class="original-price">⚡${Number(originalCost).toLocaleString()}</span>` : ''}
              </div>
              <div class="stock-text">残り ${Number(stock).toLocaleString()}口</div>
            </div>
            <div class="progress-bar">
              <div class="progress-fill" style="width: ${percent}%"></div>
            </div>
            
            <div class="gacha-btn-grid">
              <button class="gacha-btn" onclick="drawGacha(${idx}, 1)">1回引く</button>
              <button class="gacha-btn" onclick="drawGacha(${idx}, 10)">10回引く</button>
              <button class="gacha-btn" onclick="drawGacha(${idx}, 100)">100回引く</button>
              <button class="gacha-btn" onclick="drawGacha(${idx}, 1000)">1000回ひく！</button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function parseToFloat(val) {
      if (!val) return 0;
      let num = parseFloat(val);
      return isNaN(num) ? 0 : num;
    }

    // 確率計算用ガチャ処理
    function drawGacha(idx, count) {
      const p = packs[idx];
      const originalCost = parseInt(p['必要COIN'] || p['_col_1'] || 0);
      const singleCost = isNewUser ? Math.floor(originalCost * 0.2) : originalCost;
      const totalCost = singleCost * count;

      if (userCoins < totalCost) {
        alert(`コインが不足しています！（必要: ⚡${totalCost.toLocaleString()} COIN）`);
        openModal('paypalModal');
        return;
      }

      userCoins -= totalCost;
      updateStorage();

      const w1 = parseToFloat(p['_rate1']);
      const w2 = parseToFloat(p['_rate2']);
      const w3 = parseToFloat(p['_rate3']);
      const w4 = parseToFloat(p['_rate4']);
      const totalWeight = w1 + w2 + w3 + w4;

      currentResults = [];
      totalReturnCoin = 0;

      // ガチャ判定ループ
      for (let i = 0; i < count; i++) {
        const rand = Math.random() * (totalWeight > 0 ? totalWeight : 100);
        let rank = '4等';
        let name = p['4等'] || p['_col_7'] || 'ノーマルカード';

        if (rand < w1) {
          rank = '1等'; name = p['一等'] || p['1等'] || p['_col_4'];
        } else if (rand < (w1 + w2)) {
          rank = '2等'; name = p['2等'] || p['_col_5'];
        } else if (rand < (w1 + w2 + w3)) {
          rank = '3等'; name = p['3等'] || p['_col_6'];
        }

        currentResults.push({ rank, name });
        totalReturnCoin += (COIN_RETURNS[rank] || 1);
      }

      // 単発（1回）かつ1-2等または星演出を行う場合のみ演出を挟む
      if (count === 1) {
        const firstWin = currentResults[0];
        const isSuperWin = (firstWin.rank === '1等' || firstWin.rank === '2等');
        const videoUrl = isSuperWin ? p['_effectVideo'] : '';

        if (videoUrl) {
          playVideoEffect(videoUrl);
        } else {
          playStarEffect(firstWin.rank);
        }
      } else {
        // 10連・100連・1000連は演出なしで即結果表示
        showResultModal();
      }
    }

    function playVideoEffect(url) {
      const modal = document.getElementById('videoModal');
      const video = document.getElementById('gachaVideo');
      const starStage = document.getElementById('starStage');

      starStage.style.display = 'none';
      video.style.display = 'block';
      video.src = url;

      modal.style.display = 'flex';
      video.play();
      video.onended = () => {
        modal.style.display = 'none';
        showResultModal();
      };
    }

    function playStarEffect(rank) {
      const modal = document.getElementById('videoModal');
      const video = document.getElementById('gachaVideo');
      const starStage = document.getElementById('starStage');
      const starAnim = document.getElementById('starAnim');
      const starMsg = document.getElementById('starMsg');

      video.style.display = 'none';
      starStage.style.display = 'flex';
      modal.style.display = 'flex';

      starMsg.innerText = "止まれ...！";
      starAnim.style.transform = "translateX(-200px) scale(0.5)";
      starAnim.style.opacity = "1";

      setTimeout(() => {
        if (rank === '3等') {
          starAnim.style.transform = "translateX(0px) scale(1.5)";
          setTimeout(() => {
            starMsg.innerText = "止まった！！ (3等確)";
            setTimeout(() => { modal.style.display = 'none'; showResultModal(); }, 1000);
          }, 1200);
        } else {
          starAnim.style.transform = "translateX(200px) scale(0.5)";
          setTimeout(() => {
            starAnim.style.opacity = "0";
            starMsg.innerText = "通り過ぎた...";
            setTimeout(() => { modal.style.display = 'none'; showResultModal(); }, 1000);
          }, 1200);
        }
      }, 100);
    }

    function showResultModal() {
      const resRank = document.getElementById('resRank');
      const resName = document.getElementById('resName');

      if (currentResults.length === 1) {
        resRank.innerText = `${currentResults[0].rank} 当選！`;
        resName.innerText = currentResults[0].name;
      } else {
        resRank.innerText = `${currentResults.length}連ガチャ結果`;
        
        // 内訳を集計
        let summary = {};
        currentResults.forEach(r => {
          summary[r.rank] = (summary[r.rank] || 0) + 1;
        });

        let summaryHtml = `<div style="margin-bottom:10px; color:var(--coin-gold)">【獲得内訳】<br>`;
        for (let r in summary) {
          summaryHtml += `${r}: ${summary[r]}枚 / `;
        }
        summaryHtml += `</div><hr style="border-color:#333; margin:8px 0;"><div style="font-size:0.85rem;">`;

        summaryHtml += currentResults.map((item, idx) => `
          <div style="margin-bottom:3px;">${idx+1}. <span style="color:var(--coin-gold);">${item.rank}</span>: ${item.name}</div>
        `).join('');
        summaryHtml += `</div>`;

        resName.innerHTML = summaryHtml;
      }

      document.getElementById('coinVal').innerText = totalReturnCoin.toLocaleString();
      document.getElementById('actionBtns').style.display = 'flex';
      document.getElementById('shipForm').style.display = 'none';
      openModal('resultModal');
    }

    function convertCoin() {
      userCoins += totalReturnCoin;
      currentResults.forEach(item => {
        history.push({ name: item.name, rank: item.rank, status: `COIN還元済` });
      });
      updateStorage();
      alert(`⚡ ${totalReturnCoin.toLocaleString()} COIN に還元しました！`);
      closeModal('resultModal');
    }

    function showShipForm() {
      document.getElementById('actionBtns').style.display = 'none';
      document.getElementById('shipForm').style.display = 'block';
      if (savedAddress) document.getElementById('addressInput').value = savedAddress;
    }

    function submitShip() {
      const addr = document.getElementById('addressInput').value;
      if (!addr) { alert('住所を入力してください'); return; }
      savedAddress = addr;
      currentResults.forEach(item => {
        history.push({ name: item.name, rank: item.rank, status: `発送受付済 (${addr})` });
      });
      updateStorage();
      alert(`【発送受付完了】\n獲得アイテムの発送受付を完了しました。`);
      closeModal('resultModal');
    }

    function redirectToPaypal(coinAmount, priceYen) {
      closeModal('paypalModal');
      const currentUrl = encodeURIComponent(window.location.origin + window.location.pathname);
      const paypalUrl = `https://www.paypal.com/cgi-bin/webscr?cmd=_xclick&business=${encodeURIComponent(PAYPAL_RECEIVER)}&item_name=${coinAmount}COIN_Charge&amount=${priceYen}&currency_code=JPY&return=${currentUrl}`;
      window.location.href = paypalUrl;
    }

    function redeemCode() {
      const code = document.getElementById('chargeCodeInput').value.trim();
      
      if (code.startsWith(SECRET_KEY)) {
        const coinStr = code.replace(SECRET_KEY, '');
        const amount = parseInt(coinStr);

        if (!isNaN(amount) && amount > 0) {
          userCoins += amount;
          updateStorage();
          alert(`⚡ ${amount.toLocaleString()} COIN チャージしました！`);
          document.getElementById('chargeCodeInput').value = '';
          closeModal('paypalModal');
          return;
        }
      }

      if (code === '') {
        alert('コードを入力してください。');
      } else {
        alert('無効なコードです。');
      }
    }

    function saveAddress() {
      savedAddress = document.getElementById('defaultAddress').value;
      updateStorage();
      alert('デフォルトの配送先住所を保存しました！');
      closeModal('addressModal');
    }

    function openHistory() {
      const container = document.getElementById('historyList');
      if (history.length === 0) {
        container.innerHTML = '<p style="color:var(--text-gray); text-align:center;">まだ獲得履歴がありません。</p>';
      } else {
        container.innerHTML = history.slice().reverse().map(item => `
          <div style="border-bottom: 1px solid #333; padding: 8px 0;">
            <div style="color:var(--coin-gold); font-weight:bold;">${item.rank} - ${item.name}</div>
            <div style="font-size:0.75rem; color:var(--text-gray);">${item.status}</div>
          </div>
        `).join('');
      }
      openModal('historyModal');
    }

    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    // 初回起動
    loadData();
  </script>
</body>
</html>
