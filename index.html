<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOPA風 オリパアプリ</title>
  <style>
    :root {
      --dopa-red: #e6002d;
      --dopa-bg: #121212;
      --card-bg: #1e1e1e;
      --coin-gold: #ffcb05;
      --text-gray: #aaaaaa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background-color: var(--dopa-bg);
      color: #fff;
      padding-top: 60px;
      padding-bottom: 70px;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background: var(--dopa-bg);
      position: relative;
    }

    /* 上部ヘッダー */
    .header {
      position: fixed;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 100%; max-width: 480px;
      height: 60px;
      background: #181818;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      z-index: 10;
      border-bottom: 1px solid #2a2a2a;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 900;
      color: var(--dopa-red);
      letter-spacing: -1px;
    }

    .coin-status {
      display: flex;
      align-items: center;
      background: #2a2a2a;
      padding: 4px 12px;
      border-radius: 20px;
      gap: 6px;
      font-weight: bold;
    }

    .coin-icon {
      width: 20px; height: 20px;
      background: var(--coin-gold);
      border-radius: 50%;
      color: #000;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem; font-weight: 900;
    }

    /* カテゴリタブ */
    .category-bar {
      display: flex;
      background: #181818;
      border-bottom: 1px solid #2a2a2a;
      overflow-x: auto;
    }

    .tab {
      padding: 12px 18px;
      font-size: 0.9rem;
      font-weight: bold;
      color: var(--text-gray);
      white-space: nowrap;
      cursor: pointer;
    }

    .tab.active {
      color: #fff;
      border-bottom: 3px solid var(--dopa-red);
    }

    /* 一覧表示カード */
    .pack-list {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .pack-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      cursor: pointer;
    }

    .pack-banner {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
    }

    .pack-info {
      padding: 12px;
    }

    .pack-title {
      font-size: 1rem;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .price-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .price {
      font-size: 1.2rem;
      font-weight: 900;
      color: var(--coin-gold);
      display: flex; align-items: center; gap: 4px;
    }

    .stock-text {
      font-size: 0.8rem;
      color: var(--text-gray);
    }

    /* メーターバー */
    .progress-bar {
      width: 100%;
      height: 8px;
      background: #333;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #00ff88, #00f3ff);
    }

    /* 動画再生モーダル */
    .video-modal {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #000;
      z-index: 100;
      display: none;
      justify-content: center;
      align-items: center;
    }

    .video-modal video { width: 100%; height: 100%; object-fit: contain; }

    /* ガチャ結果＆選択モーダル */
    .result-modal {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(5px);
      z-index: 101;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .result-box {
      width: 100%; max-width: 360px;
      background: #222;
      border: 2px solid var(--dopa-red);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
    }

    .result-rank { font-size: 1.6rem; font-weight: 900; color: var(--coin-gold); margin-bottom: 10px; }
    .result-item-name { font-size: 1.1rem; font-weight: bold; margin-bottom: 20px; }

    .action-btns { display: flex; flex-direction: column; gap: 10px; }
    .act-btn {
      padding: 12px;
      border: none;
      border-radius: 25px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .btn-coin { background: var(--coin-gold); color: #000; }
    .btn-ship { background: var(--dopa-red); color: #fff; }

    /* 発送住所フォーム */
    .ship-form { display: none; text-align: left; margin-top: 15px; }
    .ship-form input {
      width: 100%; padding: 8px; margin: 5px 0 10px;
      border-radius: 6px; border: 1px solid #444; background: #111; color: #fff;
    }

    /* 下部ナビゲーション */
    .footer-nav {
      position: fixed;
      bottom: 0; left: 50%;
      transform: translateX(-50%);
      width: 100%; max-width: 480px;
      height: 60px;
      background: #181818;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid #2a2a2a;
    }

    .nav-item {
      display: flex; flex-direction: column; align-items: center;
      font-size: 0.7rem; color: var(--text-gray);
    }
    .nav-item.active { color: var(--dopa-red); }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- ヘッダー -->
    <header class="header">
      <div class="logo">DOPA!</div>
      <div class="coin-status">
        <div class="coin-icon">⚡</div>
        <span id="userCoins">10,000</span>
      </div>
    </header>

    <!-- カテゴリタブ -->
    <div class="category-bar">
      <div class="tab active">ポケモン</div>
      <div class="tab">ワンピース</div>
      <div class="tab">遊戯王</div>
    </div>

    <!-- パック一覧 -->
    <div class="pack-list" id="packList">
      <!-- JSでカード動的描画 -->
    </div>

    <!-- 下部ナビ -->
    <nav class="footer-nav">
      <div class="nav-item active">オリパ一覧</div>
      <div class="nav-item">速報</div>
      <div class="nav-item">ランキング</div>
      <div class="nav-item">獲得履歴</div>
      <div class="nav-item">マイページ</div>
    </nav>
  </div>

  <!-- 動画演出モーダル -->
  <div class="video-modal" id="videoModal">
    <video id="gachaVideo" playsinline></video>
  </div>

  <!-- 結果＆還元/発送モーダル -->
  <div class="result-modal" id="resultModal">
    <div class="result-box">
      <div class="result-rank" id="resRank">1等獲得！</div>
      <div class="result-item-name" id="resName">カード名</div>

      <div class="action-btns" id="actionBtns">
        <button class="act-btn btn-coin" onclick="convertCoin()">コインに変換 (<span id="coinVal">0</span> COIN)</button>
        <button class="act-btn btn-ship" onclick="showShipForm()">自宅に発送する</button>
      </div>

      <!-- 住所入力フォーム -->
      <div class="ship-form" id="shipForm">
        <label style="font-size:0.8rem">お届け先住所:</label>
        <input type="text" id="addressInput" placeholder="東京都渋谷区...">
        <button class="act-btn btn-ship" style="width:100%" onclick="submitShip()">発送を確定する</button>
      </div>
    </div>
  </div>

  <script>
    const SPREADSHEET_ID = '1CaHgKm-ti-JVyW79mK8wXT21TqjTrIEz6_YYbtrn-5U';
    const GVIZ_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=Sheet1`;

    let userCoins = 10000;
    let packs = [];
    let currentWin = null;

    // 還元コインマッピング
    const COIN_RETURNS = {
      '1等': 1600,
      '2等': 600,
      '3等': 10,
      '4等': 1
    };

    async function loadData() {
      try {
        const res = await fetch(GVIZ_URL);
        const txt = await res.text();
        const json = JSON.parse(txt.substring(txt.indexOf('{'), txt.lastIndexOf('}') + 1));
        const cols = json.table.cols.map(c => c ? c.label : '');
        
        packs = json.table.rows.map(r => {
          let item = {};
          r.c.forEach((cell, i) => { if (cols[i]) item[cols[i]] = cell ? cell.v : ''; });
          return item;
        }).filter(item => item['名前']);

        renderPackList();
      } catch (e) {
        console.error(e);
      }
    }

    function renderPackList() {
      const container = document.getElementById('packList');
      container.innerHTML = '';

      packs.forEach((p, idx) => {
        const cost = p['必要COIN'] || 0;
        const stock = p['在庫数'] || 100;
        const maxStock = 50000; // 仮の総在庫基準
        const percent = Math.min(100, (stock / maxStock) * 100);

        const card = document.createElement('div');
        card.className = 'pack-card';
        card.onclick = () => drawGacha(idx);
        card.innerHTML = `
          <img class="pack-banner" src="${p['サムネURL'] || ''}" alt="パック">
          <div class="pack-info">
            <div class="pack-title">${p['名前']}</div>
            <div class="price-row">
              <div class="price">⚡ ${Number(cost).toLocaleString()} /1回</div>
              <div class="stock-text">残り ${Number(stock).toLocaleString()}口</div>
            </div>
            <div class="progress-bar">
              <div class="progress-fill" style="width: ${percent}%"></div>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function drawGacha(idx) {
      const p = packs[idx];
      const cost = parseInt(p['必要COIN'] || 0);

      if (userCoins < cost) {
        alert('コインが不足しています！');
        return;
      }

      // コイン消費
      userCoins -= cost;
      document.getElementById('userCoins').innerText = userCoins.toLocaleString();

      // 確率判定
      const p1 = parseFloat(p['1等確率'] || 0);
      const p2 = parseFloat(p['2等確率'] || 0);
      const p3 = parseFloat(p['3等確率'] || 0);
      const rand = Math.random() * 100;

      let rank = '4等';
      let name = p['4等'] || 'ノーマルカード';
      let isSuperWin = false;

      if (rand < p1) {
        rank = '1等'; name = p['一等']; isSuperWin = true;
      } else if (rand < (p1 + p2)) {
        rank = '2等'; name = p['2等']; isSuperWin = true;
      } else if (rand < (p1 + p2 + p3)) {
        rank = '3等'; name = p['3等'];
      }

      currentWin = { rank, name };

      // 動画再生
      const videoUrl = isSuperWin ? (p['確定演出動画'] || p['動画URL']) : p['動画URL'];
      if (videoUrl) {
        const modal = document.getElementById('videoModal');
        const video = document.getElementById('gachaVideo');
        video.src = videoUrl;
        modal.style.display = 'flex';
        video.play();
        video.onended = () => {
          modal.style.display = 'none';
          showResultModal();
        };
      } else {
        showResultModal();
      }
    }

    function showResultModal() {
      document.getElementById('resRank').innerText = `${currentWin.rank} 当選！`;
      document.getElementById('resName').innerText = currentWin.name;
      
      const returnCoins = COIN_RETURNS[currentWin.rank] || 1;
      document.getElementById('coinVal').innerText = returnCoins;

      document.getElementById('actionBtns').style.display = 'flex';
      document.getElementById('shipForm').style.display = 'none';
      document.getElementById('resultModal').style.display = 'flex';
    }

    function convertCoin() {
      const addCoins = COIN_RETURNS[currentWin.rank] || 1;
      userCoins += addCoins;
      document.getElementById('userCoins').innerText = userCoins.toLocaleString();
      alert(`${addCoins} COINに還元しました！`);
      document.getElementById('resultModal').style.display = 'none';
    }

    function showShipForm() {
      document.getElementById('actionBtns').style.display = 'none';
      document.getElementById('shipForm').style.display = 'block';
    }

    function submitShip() {
      const addr = document.getElementById('addressInput').value;
      if (!addr) { alert('住所を入力してください'); return; }
      alert(`【発送受付完了】\n${currentWin.name}\nお届け先: ${addr}`);
      document.getElementById('resultModal').style.display = 'none';
    }

    loadData();
  </script>
</body>
</html>
