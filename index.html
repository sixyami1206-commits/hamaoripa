<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CoreBank - ネオバンク</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    :root {
      --primary: #059669;
      --primary-hover: #047857;
      --bg-color: #f0fdf4;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-sub: #6b7280;
      --border-color: #e5e7eb;
    }

    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 12px 8px 40px;
      -webkit-text-size-adjust: 100%;
    }

    .container { max-width: 400px; margin: 0 auto; }
    .header-logo { text-align: center; font-size: 1.2rem; font-weight: 800; color: var(--primary); margin-bottom: 12px; }
    .card { background: var(--card-bg); border-radius: 12px; padding: 14px; margin-bottom: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.03); border: 1px solid var(--border-color); }
    .card-title { font-size: 0.9rem; font-weight: bold; color: var(--primary); border-bottom: 2px solid #ecfdf5; padding-bottom: 6px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }

    label { display: block; font-weight: 700; font-size: 0.8rem; margin-top: 10px; }
    input[type="text"], input[type="number"] { width: 100%; padding: 8px 10px; border: 1px solid var(--border-color); border-radius: 6px; margin-top: 4px; font-size: 0.85rem; }
    .btn { width: 100%; background: var(--primary); color: white; border: none; padding: 10px; border-radius: 8px; font-size: 0.85rem; font-weight: bold; cursor: pointer; margin-top: 12px; }
    .btn-sub { background: #10b981; }

    .upload-box { border: 2px dashed #a7f3d0; background: #ecfdf5; border-radius: 8px; padding: 20px 10px; text-align: center; cursor: pointer; margin-top: 10px; }
    .status-badge { background: #d1fae5; color: var(--primary); padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 0.75rem; }
    
    .nav-tabs { display: flex; gap: 4px; margin-bottom: 12px; }
    .tab-btn { flex: 1; padding: 8px 4px; background: #e5e7eb; border: none; border-radius: 6px; font-size: 0.75rem; font-weight: bold; cursor: pointer; color: var(--text-sub); }
    .tab-btn.active { background: var(--primary); color: white; }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: white; padding: 20px; border-radius: 12px; width: 90%; max-width: 320px; text-align: center; }
    .spinner { border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; width: 36px; height: 36px; animation: spin 1s linear infinite; margin: 12px auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-logo">
      <i class="fa-solid fa-building-columns"></i> CoreBank
    </div>

    <!-- 1. 本人確認QRスキャン & アカウント自動開設 -->
    <div id="section-kyc">
      <div class="card">
        <div class="card-title"><i class="fa-solid fa-qrcode"></i> 本人確認QRコードスキャン</div>
        <div class="upload-box" onclick="document.getElementById('qr-input').click()">
          <i class="fa-solid fa-file-image" style="font-size: 2rem; color: var(--primary);"></i>
          <div style="font-size:0.8rem; font-weight:bold; color:var(--primary); margin-top:4px;" id="upload-text">QRコード画像を選択</div>
        </div>
        <input type="file" id="qr-input" accept="image/*" style="display:none;" onchange="processQRImage(this)">
        <canvas id="qr-canvas" style="display:none;"></canvas>
      </div>
    </div>

    <!-- 2. マイページ（ログイン後表示） -->
    <div id="section-mypage" style="display:none;">
      <!-- アカウント情報カード -->
      <div class="card">
        <div class="card-title">
          <span>コアバンク根岸店</span>
          <span class="status-badge">ACTIVE</span>
        </div>
        <div style="font-size:0.8rem; color:var(--text-sub);">口座番号: <strong id="user-acc-num" style="color:var(--text-main);"></strong></div>
        <div style="font-size:0.8rem; color:var(--text-sub);">名義: <strong id="user-name" style="color:var(--text-main);"></strong></div>
        <hr style="border:none; border-top:1px dashed var(--border-color); margin:10px 0;">
        <div style="font-size:0.75rem; color:var(--text-sub);">利用可能残高</div>
        <div style="font-size:1.6rem; font-weight:800; color:var(--primary);"><span id="user-balance">1</span> 円</div>
      </div>

      <!-- 操作タブナビゲーション -->
      <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('transfer', event)">個人間送金</button>
        <button class="tab-btn" onclick="switchTab('shimru', event)">SHIMRU決済</button>
        <button class="tab-btn" onclick="switchTab('charge', event)">コードチャージ</button>
      </div>

      <!-- Tab 1: 個人間送金 -->
      <div class="card tab-content" id="tab-transfer">
        <div class="card-title"><i class="fa-solid fa-paper-plane"></i> 相手のローマ字名義で検索</div>
        <div style="display:flex; gap:6px;">
          <input type="text" id="search-query" placeholder="例: YAMADA">
          <button class="btn" style="width: auto; margin-top: 4px; padding: 0 12px;" onclick="searchUser()">検索</button>
        </div>
        
        <div id="search-results" style="margin-top:8px;"></div>

        <label>選択された送金先</label>
        <input type="text" id="target-acc-num" readonly placeholder="相手を選択してください" style="background:#f3f4f6;">

        <label>送金金額（円）</label>
        <input type="number" id="transfer-amount" placeholder="1000">
        <div style="font-size:0.7rem; color:var(--primary); margin-top:2px;">※送金すると0.7%の利子が即時還元されます。</div>

        <button class="btn" onclick="executeTransfer()">送金を実行する</button>
      </div>

      <!-- Tab 2: SHIMRU法人支払い -->
      <div class="card tab-content" id="tab-shimru" style="display:none;">
        <div class="card-title"><i class="fa-solid fa-building"></i> SHIMRU法人への支払い</div>
        <label>提供サービス名</label>
        <input type="text" id="shimru-service" placeholder="例: プレミアムサービス">

        <label>お名前</label>
        <input type="text" id="shimru-payer" placeholder="例: 山田 太郎">

        <label>支払金額（円）</label>
        <input type="number" id="shimru-amount" placeholder="5000">

        <button class="btn" onclick="executeShimruPay()">支払いを確定する</button>
      </div>

      <!-- Tab 3: プリペイドコードチャージ -->
      <div class="card tab-content" id="tab-charge" style="display:none;">
        <div class="card-title"><i class="fa-solid fa-bolt"></i> プリペイドコードチャージ</div>
        <label>16桁プリペイドコード</label>
        <input type="text" id="prepaid-code" placeholder="例: ABCD-1234-EFGH-5678">

        <button class="btn btn-sub" onclick="executePrepaidCharge()">チャージを実行する</button>
      </div>
    </div>
  </div>

  <!-- 送金中・10秒タイマーモーダル -->
  <div class="modal-overlay" id="transfer-modal" style="display:none;">
    <div class="modal-content">
      <div class="spinner"></div>
      <div style="font-size:0.9rem; font-weight:bold; color:var(--text-main);">送金処理中</div>
      <div style="font-size:0.75rem; color:var(--text-sub); margin-top:6px;">
        運営が代金を確認しています。<br>送金完了まで最大10分かかります。
      </div>
      <div style="font-size:1.1rem; font-weight:bold; color:var(--primary); margin-top:10px;" id="modal-timer">10秒</div>
    </div>
  </div>

  <script>
    // 発行されたGASデプロイURL
    const GAS_ENDPOINT = "https://script.google.com/macros/s/AKfycbwpeLq5Kipg_8LjtY8WhCn_NttD0rWU6ytPBP9SvZDZ9NKl-Me1F12w1YwPl1hb5ciuNw/exec";

    let currentUser = { email: "", romanName: "", password: "", accountNumber: "", balance: 1 };

    // --- 高精度QRコード解析＆自動口座開設 ---
    function processQRImage(input) {
      if (!input.files || !input.files[0]) return;
      
      const uploadText = document.getElementById('upload-text');
      uploadText.textContent = "解析中...";

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.getElementById('qr-canvas');
          const ctx = canvas.getContext('2d');
          
          let width = img.width;
          let height = img.height;
          const maxDimension = 800;

          if (width > maxDimension || height > maxDimension) {
            if (width > height) {
              height = Math.round((height * maxDimension) / width);
              width = maxDimension;
            } else {
              width = Math.round((width * maxDimension) / height);
              height = maxDimension;
            }
          }

          canvas.width = width;
          canvas.height = height;
          ctx.drawImage(img, 0, 0, width, height);

          const imageData = ctx.getImageData(0, 0, width, height);
          const code = jsQR(imageData.data, imageData.width, imageData.height, {
            inversionAttempts: "dontInvert"
          });

          if (code && code.data) {
            try {
              let payload = {};
              if (code.data.trim().startsWith('{')) {
                payload = JSON.parse(code.data);
              } else {
                const lines = code.data.split('\n').map(l => l.trim());
                payload = {
                  kyc: lines[0],
                  romanName: lines[1],
                  email: lines[2],
                  password: lines[3]
                };
              }

              const kycFlag = String(payload.kyc || "").toLowerCase();
              const romanName = payload.romanName || payload.name || payload.HolderName;
              const email = payload.email || payload.mail;
              const password = payload.password || payload.pass;

              if ((kycFlag === "okekyc" || kycFlag === "ok") && romanName && email) {
                currentUser.romanName = String(romanName).toUpperCase();
                currentUser.email = email;
                currentUser.password = password || "123456";

                uploadText.textContent = "通信中...";

                fetch(GAS_ENDPOINT, {
                  method: "POST",
                  body: JSON.stringify({
                    action: "createAccount",
                    romanName: currentUser.romanName,
                    email: currentUser.email,
                    password: currentUser.password
                  })
                })
                .then(res => res.json())
                .then(res => {
                  if (res.success) {
                    currentUser.accountNumber = res.accountNumber;
                    currentUser.balance = res.balance;
                    document.getElementById('section-kyc').style.display = 'none';
                    document.getElementById('section-mypage').style.display = 'block';
                    updateUserUI();
                    alert(`本人確認・口座開設が完了しました！\n口座番号: ${res.accountNumber}\n初期残高: 1円`);
                  } else {
                    alert('口座作成エラー: ' + res.message);
                    uploadText.textContent = "QRコード画像を選択";
                  }
                })
                .catch(err => {
                  alert('通信エラーが発生しました。接続をご確認ください。');
                  uploadText.textContent = "QRコード画像を選択";
                });

              } else {
                alert(`QRコードのデータ構造が不完全です。\n読み取り結果:\n${code.data}`);
                uploadText.textContent = "QRコード画像を選択";
              }
            } catch(err) {
              alert(`QRデータ解析エラー:\n${code.data}`);
              uploadText.textContent = "QRコード画像を選択";
            }
          } else {
            alert('画像からQRコードを検出できませんでした。鮮明な画像を選択してください。');
            uploadText.textContent = "QRコード画像を選択";
          }
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(input.files[0]);
    }

    function updateUserUI() {
      document.getElementById('user-acc-num').textContent = currentUser.accountNumber;
      document.getElementById('user-name').textContent = currentUser.romanName;
      document.getElementById('user-balance').textContent = currentUser.balance.toLocaleString();
    }

    // --- タブ切り替え ---
    function switchTab(tabName, event) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.style.display = 'none');
      if (event && event.target) {
        event.target.classList.add('active');
      }
      document.getElementById(`tab-${tabName}`).style.display = 'block';
    }

    // --- 名義検索 ---
    function searchUser() {
      const q = document.getElementById('search-query').value.trim();
      if (!q) return;

      fetch(`${GAS_ENDPOINT}?action=searchUser&name=${encodeURIComponent(q)}`)
      .then(res => res.json())
      .then(list => {
        const container = document.getElementById('search-results');
        container.innerHTML = "";
        if (!list || list.length === 0) {
          container.innerHTML = "<div style='font-size:0.75rem; color:red;'>該当する名義が見つかりません</div>";
          return;
        }
        list.forEach(u => {
          const div = document.createElement('div');
          div.style.cssText = "padding:6px; background:#f9fafb; border:1px solid #e5e7eb; border-radius:4px; margin-bottom:4px; font-size:0.75rem; cursor:pointer;";
          div.innerHTML = `<strong>${u.holderName}</strong> (${u.accountNumber})`;
          div.onclick = () => { document.getElementById('target-acc-num').value = u.accountNumber; };
          container.appendChild(div);
        });
      })
      .catch(err => {
        alert("検索時に通信エラーが発生しました。");
      });
    }

    // --- 個人間送金（10秒タイマー & 0.7% 利子還元）---
    function executeTransfer() {
      const toAcc = document.getElementById('target-acc-num').value;
      const amount = Number(document.getElementById('transfer-amount').value);
      if (!toAcc || amount <= 0) return alert('送金先と金額を正しく入力してください。');
      if (currentUser.balance < amount) return alert('残高が不足しています。');

      const modal = document.getElementById('transfer-modal');
      const timerLabel = document.getElementById('modal-timer');
      modal.style.display = 'flex';
      let left = 10;
      timerLabel.textContent = `${left}秒`;

      const countdown = setInterval(() => {
        left--;
        timerLabel.textContent = `${left}秒`;
        if (left <= 0) {
          clearInterval(countdown);
          fetch(GAS_ENDPOINT, {
            method: "POST",
            body: JSON.stringify({
              action: "transfer",
              fromAccountNumber: currentUser.accountNumber,
              toAccountNumber: toAcc,
              amount: amount
            })
          })
          .then(res => res.json())
          .then(res => {
            modal.style.display = 'none';
            if (res.success) {
              currentUser.balance = res.newBalance;
              updateUserUI();
              alert(`送金完了！ 0.7%の利子（+${res.interestAdded}円）が残高に還元されました。`);
            } else { alert(res.message); }
          })
          .catch(err => {
            modal.style.display = 'none';
            alert('送金実行時に通信エラーが発生しました。');
          });
        }
      }, 1000);
    }

    // --- SHIMRU法人決済 ---
    function executeShimruPay() {
      const service = document.getElementById('shimru-service').value.trim();
      const payer = document.getElementById('shimru-payer').value.trim();
      const amount = Number(document.getElementById('shimru-amount').value);
      if (!service || !payer || amount <= 0) return alert('すべての項目を入力してください。');

      fetch(GAS_ENDPOINT, {
        method: "POST",
        body: JSON.stringify({
          action: "payToShimru",
          accountNumber: currentUser.accountNumber,
          serviceName: service,
          payerName: payer,
          amount: amount
        })
      })
      .then(res => res.json())
      .then(res => {
        if (res.success) {
          currentUser.balance = res.newBalance;
          updateUserUI();
          alert('SHIMRU法人への支払いが完了し、Discordに着金通知が送信されました！');
        } else { alert(res.message); }
      });
    }

    // --- プリペイドコードチャージ ---
    function executePrepaidCharge() {
      const code = document.getElementById('prepaid-code').value.trim();
      if (!code) return alert('コードを入力してください。');

      fetch(GAS_ENDPOINT, {
        method: "POST",
        body: JSON.stringify({
          action: "chargePrepaid",
          accountNumber: currentUser.accountNumber,
          prepaidCode: code
        })
      })
      .then(res => res.json())
      .then(res => {
        if (res.success) {
          currentUser.balance = res.newBalance;
          updateUserUI();
          alert(`${res.chargedAmount}円のチャージが完了しました！`);
        } else { alert(res.message); }
      });
    }
  </script>
</body>
</html>
